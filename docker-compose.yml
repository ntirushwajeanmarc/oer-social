services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oer
      POSTGRES_PASSWORD: oer
      POSTGRES_DB: oer_social
    ports:
      - "5434:5432"
    volumes:
      - oer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oer -d oer_social"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://oer:oer@db:5432/oer_social
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MEDIA_DIR: /app/media
    volumes:
      - ./backend/app:/app/app
      - oer_media:/app/media
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_MEDIA_URL: ""
        BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_MEDIA_URL: ""
      BACKEND_URL: http://api:8000
    depends_on:
      - api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # Production tunnel ONLY. Enable on the VPS with:
  #   COMPOSE_PROFILES=tunnel
  #   CLOUDFLARE_TUNNEL_TOKEN=...
  # in the project .env — then `docker compose up -d` starts it.
  #
  # NEVER run this profile on a laptop with the same production token.
  # Multiple connectors → intermittent Cloudflare 502s.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env (VPS only)}
    depends_on:
      web:
        condition: service_healthy

volumes:
  oer_pg:
  oer_media:
